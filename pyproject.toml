[project]
name = "ai-agent"
version = "0.1.0"
description = "A production-lite agentic AI system with safety, resilience, and observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangGraph framework (new — framework/)
    "langgraph>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-groq>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    # Shared / legacy plain-Python agent/ (direct provider SDKs dropped due to
    # a groq<1 vs >=1.5 conflict with langchain-groq; removed fully in Phase 6)
    "mcp[cli]>=1.28.1",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.0",
    "uvicorn>=0.51.0",
    "langchain-mcp-adapters>=0.3.2",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]
